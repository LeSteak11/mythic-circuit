<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" font-family="system-ui, sans-serif" font-size="14">
  <rect width="900" height="760" fill="#ffffff" />
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#111">Mythic Circuit — card master canvas and safe zones (1024×1432, shown at half scale)</text>

  <!-- Card canvas 1024x1432 at half scale = 512x716 -->
  <g transform="translate(40,60)">
    <rect x="0" y="0" width="512" height="716" fill="#f4f4f8" stroke="#333" stroke-width="2" />
    <text x="8" y="-8" fill="#333">Card/frame canvas: 1024 × 1432 px (sRGB, transparency allowed)</text>

    <!-- outer bleed / frame zone: 24px at full scale = 12 -->
    <rect x="12" y="12" width="488" height="692" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" />
    <text x="20" y="32" fill="#c0392b">Frame zone — decorative frame art only (24 px border at full scale)</text>

    <!-- name bar -->
    <rect x="24" y="40" width="464" height="56" fill="#d9e4f5" stroke="#2a5599" />
    <text x="32" y="74" fill="#2a5599">NAME BAR (creature name overlay) — keep art quiet here</text>

    <!-- art window: square, 928x928 at full = 464x464 -->
    <rect x="24" y="104" width="464" height="464" fill="#e8f5e9" stroke="#2e7d32" />
    <text x="32" y="126" fill="#2e7d32">ART WINDOW — 1024×1024 source, square crop</text>
    <!-- central 80% safe area -->
    <rect x="70.4" y="150.4" width="371.2" height="371.2" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="8 5" />
    <text x="80" y="172" fill="#2e7d32">Critical subject inside central 80%</text>

    <!-- meta row: element + rarity -->
    <rect x="24" y="576" width="464" height="36" fill="#fff3e0" stroke="#b26a00" />
    <text x="32" y="600" fill="#b26a00">ELEMENT + RARITY overlay row</text>

    <!-- stats row -->
    <rect x="24" y="618" width="464" height="40" fill="#fde2e4" stroke="#a4283a" />
    <text x="32" y="644" fill="#a4283a">POWER / VITALITY stat overlay row</text>

    <!-- ability text -->
    <rect x="24" y="664" width="464" height="40" fill="#ede7f6" stroke="#5e35b1" />
    <text x="32" y="690" fill="#5e35b1">ABILITY TEXT overlay (2–3 lines)</text>
  </g>

  <!-- Icon spec -->
  <g transform="translate(620,60)">
    <text x="0" y="0" font-weight="bold" fill="#111">Icon deliverables</text>
    <rect x="0" y="16" width="128" height="128" fill="#f4f4f8" stroke="#333" stroke-width="2" />
    <rect x="16" y="32" width="96" height="96" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" />
    <text x="0" y="168" fill="#333">128×128 (PNG) or SVG;</text>
    <text x="0" y="186" fill="#c0392b">critical marks inside 96×96</text>

    <text x="0" y="240" font-weight="bold" fill="#111">Legend</text>
    <rect x="0" y="252" width="18" height="12" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="26" y="263" fill="#333">dashed = safe-zone boundary</text>
    <rect x="0" y="274" width="18" height="12" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="26" y="285" fill="#333">solid = overlay region reserved by the UI</text>

    <text x="0" y="330" font-weight="bold" fill="#111">Rules of thumb</text>
    <text x="0" y="352" fill="#333">• Overlays (name, stats, ability) are drawn</text>
    <text x="0" y="370" fill="#333">  by the card component — never bake text</text>
    <text x="0" y="388" fill="#333">  into art or frame files.</text>
    <text x="0" y="412" fill="#333">• Frames must stay transparent inside the</text>
    <text x="0" y="430" fill="#333">  art window and overlay rows.</text>
    <text x="0" y="454" fill="#333">• The UI may crop art to a square at any</text>
    <text x="0" y="472" fill="#333">  size from 96 px up — design for legibility.</text>
  </g>
</svg>
